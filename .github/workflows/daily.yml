name: Daily Cobble Tales Reddit Stories

on:
  schedule:
    # 14:00 UTC daily (staggered an hour after career-edge-bot's run so
    # they don't compete for the same GitHub Actions minute). Adjust to taste.
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # lets you click "Run workflow" in the Actions tab to test on demand

permissions:
  contents: write   # needed so the job can commit the updated used-category state back

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    # Each video takes ~3-5 min to render (generated gameplay + encode) plus
    # up to ~5 min per platform waiting on Instagram/TikTok processing.
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (ffmpeg + fonts for captions)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh TikTok access token
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: python scripts/refresh_tiktok_token.py

      - name: Refresh Instagram access token
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: python scripts/refresh_instagram_token.py

      - name: Run daily pipeline (Reddit-story videos)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          # IG_ACCESS_TOKEN is NOT set here -- the "Refresh Instagram
          # access token" step above sets it fresh via $GITHUB_ENV, same
          # reasoning as TIKTOK_ACCESS_TOKEN below.
          # TIKTOK_ACCESS_TOKEN is NOT set here -- the "Refresh TikTok
          # access token" step above sets it fresh via $GITHUB_ENV so
          # every run uses a token that's at most a few seconds old.
          TIKTOK_PRIVACY_LEVEL: ${{ vars.TIKTOK_PRIVACY_LEVEL || 'SELF_ONLY' }}
          # Optional repo Variables (Settings -> Secrets and variables ->
          # Actions -> Variables). PARKOUR_CLIP_URLS: direct links to your own
          # real gameplay clips (e.g. in your R2 bucket) -- leave unset to use
          # assets/parkour/ clips, or generated gameplay if that's empty too.
          PARKOUR_CLIP_URLS: ${{ vars.PARKOUR_CLIP_URLS }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'en-US-GuyNeural' }}
          TTS_RATE: ${{ vars.TTS_RATE || '+5%' }}
        run: python -m src.main

      - name: Commit updated category rotation state
        run: |
          git config user.name "cobble-tales-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/used_reddit_story_categories.json
          git diff --cached --quiet || git commit -m "chore: record today's categories as used [skip ci]"
          git push
