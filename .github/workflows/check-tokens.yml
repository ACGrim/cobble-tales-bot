name: Check tokens

# Verifies the TikTok, Instagram and GitHub credentials the daily run uses.
# Posts nothing. Run it from the Actions tab whenever a token warning shows up.
on:
  workflow_dispatch: {}
  push:
    branches: [token-fixes]   # temporary, removed before merge

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Check credentials (nothing is posted)
        env:
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          LIST_IG_MEDIA: "1"   # temporary
        run: python scripts/check_tokens.py
