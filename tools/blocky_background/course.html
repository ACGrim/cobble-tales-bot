  the course pieces, the themes.

      course.html?theme=sky&seed=7        (themes: sky, candy, lava, ice)

/* ------------------------------------------------------------------ setup */
const canvas = document.getElementById('c');
let renderer, scene, camera, sun, TH, course, pip, parts, amb, below;
const chunks = new Map(); const CHUNK = 24;
const geoCache = new Map(), matCache = new Map();
let LAMBERT = true;

function rbox(w, h, d, r) {
  r = Math.max(0.004, Math.min(r, w / 2 - 0.002, h / 2 - 0.002, d / 2 - 0.002));
  const key = [w, h, d, r].map(v => v.toFixed(3)).join(',');
  if (geoCache.has(key)) return geoCache.get(key);
  const s = new THREE.Shape(), eps = 0.00001, rad = r - eps;
  s.absarc(eps, eps, eps, -PI / 2, -PI, true);
  s.absarc(eps, h - rad * 2, eps, PI, PI / 2, true);
  s.absarc(w - rad * 2, h - rad * 2, eps, PI / 2, 0, true);
  s.absarc(w - rad * 2, eps, eps, 0, -PI / 2, true);

}
function mat(c, emissive, ei) {

function put(parent, obj, x, y, z) { obj.position.set(x, y, z); parent.add(obj); return obj; }

}
function shade(hex, f) { const c = new THREE.Color(hex); c.multiplyScalar(f); return '#' + c.getHexString(); }

/* ------------------------------------------------------------------ world pieces (s = distance forward, world z = -s) */
let rnd = Math.random;
const pick = a => a[Math.floor(rnd() * a.length)];
const rr = (a, b) => a + rnd() * (b - a);

function bodyColors() {
  const body = pick(TH.body);
  const under = TH.under ? pick(TH.under) : shade(body, 0.82);
  // candy: frosting tinted to match the cake underneath, so the tops aren't plain white
  const top = TH.prop === 'lollipop' ? '#' + new THREE.Color(body).lerp(new THREE.Color('#ffffff'), 0.55).getHexString() : pick(TH.top);
  return { top, body, under, under2: shade(under, 0.88) };
}
function crackMat() { return mat('#ff7a1a', '#ff5a00', 1.3); }
function addCracks(g, x, y, z, w, d) {
  const n = 1 + Math.floor(rnd() * 3);
  for (let i = 0; i < n; i++) {
    const cw = rr(0.3, Math.min(1.4, w * 0.5));
    put(g, box(cw, 0.07, 0.05, null, 0.02, false, crackMat()), x + rr(-w / 2 + cw / 2 + 0.1, w / 2 - cw / 2 - 0.1), y + rr(-0.5, 0.35), z + d / 2 + 0.005);
  }
  if (rnd() < 0.6) put(g, box(0.05, 0.07, rr(0.3, 0.9), null, 0.02, false, crackMat()), x + w / 2 + 0.005, y + rr(-0.4, 0.3), z + rr(-d / 3, d / 3));
}
function island(cx, s0, s1, top, width, opts = {}) {

  put(g, box(width - 0.3, 1.3, L - 0.3, col.body, 0.12), cx, top - 1.05, cz);
  if (TH.deco === 'sprinkles' || TH.prop === 'lollipop') {
    // frosting drips over the front edge
    for (let i = 0; i < Math.floor(width / 0.9); i++) if (rnd() < 0.65) put(g, box(0.34, rr(0.25, 0.6), 0.12, col.top, 0.06, false), cx - width / 2 + 0.45 + i * 0.9, top - 0.45, cz + L / 2 - 0.02);
  }
  if (TH.cracks) addCracks(g, cx, top - 1.05, cz, width - 0.3, L - 0.3);
  put(g, box(width * 0.62, 0.9, L * 0.58, col.under, 0.12), cx + u, top - 2.12, cz);

}
function pillar(cx, cs, top, size = 1.7) {
  const g = chunkAt(cs), cz = -cs, col = bodyColors(), hgt = rr(2.2, 3.4);
  put(g, box(size, 0.4, size, col.top, 0.1), cx, top - 0.2, cz);
  put(g, box(size - 0.24, hgt, size - 0.24, col.body, 0.08), cx, top - 0.4 - hgt / 2, cz);
  if (TH.cracks) addCracks(g, cx, top - 0.9, cz, size - 0.24, size - 0.24);
  put(g, box(size * 0.55, 0.7, size * 0.55, col.under, 0.08), cx, top - 0.75 - hgt, cz);

}
function tree(g, x, y, z, s = 1) {
  const p = TH.prop;
  if (p === 'tree') {
    put(g, box(0.42 * s, 1.3 * s, 0.42 * s, '#8b5a2b', 0.06), x, y + 0.65 * s, z);
    put(g, box(1.9 * s, 1.15 * s, 1.9 * s, '#3faa48', 0.18), x, y + 1.6 * s, z);
    put(g, box(1.25 * s, 0.8 * s, 1.25 * s, '#52c25a', 0.16), x, y + 2.45 * s, z);
  } else if (p === 'lollipop') {
    if (rnd() < 0.55) {
      put(g, box(0.14 * s, 1.9 * s, 0.14 * s, '#ffffff', 0.05), x, y + 0.95 * s, z);
      const c = pick(['#ff5fa2', '#7a5cff', '#3fd1c4', '#ffb23f']);
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.78 * s, 0.78 * s, 0.24 * s, 20), mat(c)); disc.rotation.x = PI / 2; disc.castShadow = true;
      put(g, disc, x, y + 2.25 * s, z);

    } else {

      put(g, box(1.1 * s, 0.9 * s, 1.1 * s, c, 0.4 * s), x, y + 0.45 * s, z);

    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.5 * s, h, 4), mat('#2a2433')); spike.castShadow = true; spike.rotation.y = PI / 4;
    put(g, spike, x, y + h / 2, z);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.2 * s, 0.5 * s, 4), mat('#ff9a3a', '#ff6a00', 1.4)); tip.rotation.y = PI / 4;
    put(g, tip, x, y + h + 0.05, z);
    put(g, box(0.5 * s, 0.3 * s, 0.5 * s, '#ffb02e', 0.08, false, mat('#ffb02e', '#ff7a00', 1.1)), x + 0.6 * s, y + 0.15 * s, z + 0.3 * s);
  } else if (p === 'pine') {
    put(g, box(0.36 * s, 0.9 * s, 0.36 * s, '#7a5232', 0.05), x, y + 0.45 * s, z);
    [[1.0, 0.9, 1.25], [0.78, 0.85, 1.95], [0.52, 0.75, 2.55]].forEach(([r, h, yy]) => {
      const c = new THREE.Mesh(new THREE.ConeGeometry(r * s, h * s, 6), mat('#2f7d4f')); c.castShadow = true; put(g, c, x, y + yy * s, z);
      const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 0.62 * s, h * 0.42 * s, 6), mat('#ffffff')); put(g, cap, x, y + (yy + h * 0.3) * s, z);
    });
  }
}
function deco(g, x0, x1, s0, s1, top, n) {
  for (let i = 0; i < n; i++) {
    const side = i % 2 ? 1 : -1;
    const x = (x0 + x1) / 2 + side * rr(1.1, (x1 - x0) / 2 - 0.2);
    const s = rr(s0 + 0.4, s1 - 0.4);
    if (TH.deco === 'flowers') put(g, box(0.17, 0.17, 0.17, pick(['#ff7aa8', '#ffe066', '#ffffff', '#b48cff']), 0.04, false), x, top + 0.085, -s);
    else if (TH.deco === 'sprinkles') put(g, box(0.28, 0.08, 0.08, pick(['#ff5fa2', '#3fd1c4', '#7a5cff', '#ffb23f', '#ffffff']), 0.03, false), x, top + 0.04, -s).rotation.y = rnd() * PI;
    else if (TH.deco === 'pebbles') { const m = rnd() < 0.3 ? mat('#ffb02e', '#ff7a00', 1.0) : null; put(g, box(0.22, 0.14, 0.22, '#3a3444', 0.05, false, m), x, top + 0.07, -s); }
    else if (TH.deco === 'snow') put(g, box(rr(0.4, 0.8), 0.18, rr(0.4, 0.8), '#ffffff', 0.09, false), x, top + 0.09, -s);
  }
}
function cloud(x, y, s, sc) {
  const g = chunkAt(s);
  const m = mat(TH.cloud.color, TH.cloud.emissive, TH.cloud.ei);
  [[0, 0, 0, 3.2, 1.3, 1.8], [1.45, 0.45, 0.1, 2, 1.4, 1.6], [-1.35, 0.25, -0.1, 1.8, 1.1, 1.5], [0.35, 0.95, -0.2, 1.6, 0.9, 1.3]]
    .forEach(p => { const c = new THREE.Mesh(rbox(p[3] * sc, p[4] * sc, p[5] * sc, 0.45 * sc), m); put(g, c, x + p[0] * sc, y + p[1] * sc, -s + p[2] * sc); });
}
function scenery(s0, s1) {
  for (let s = s0; s < s1; s += CHUNK) {
    const n = 2 + Math.floor(rnd() * 2);
    for (let i = 0; i < n; i++) {
      const side = rnd() < 0.5 ? -1 : 1;
      const x = side * rr(16, 48), cs = s + rr(0, CHUNK), top = rr(-9, 9), w = rr(5, 11), L = rr(5, 11);
      const g = island(x, cs - L / 2, cs + L / 2, top, w, { u: rr(-1, 1) });
      tree(g, x + rr(-w / 4, w / 4), top, -cs + rr(-L / 4, L / 4), rr(0.9, 1.4));
    }
    if (rnd() < 0.9) cloud(rr(-55, 55), rr(10, 22), s + rr(0, CHUNK) + 30, rr(1.2, 2.4));
    if (TH.lowClouds && rnd() < 0.8) cloud(rr(-30, 30), TH.below.y + rr(5, 9), s + rr(0, CHUNK), rr(1.6, 2.8));

}

/* ------------------------------------------------------------------ Pip, the Cobble Tales mascot */
function faceTex(kind) {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const ell = (x, y, rx, ry) => { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, PI * 2); g.fill(); };
  const pill = (x, y, w, h) => { const r = w / 2; g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fill(); };
  g.fillStyle = 'rgba(255,110,110,0.38)'; ell(58, 170, 26, 15); ell(198, 170, 26, 15);
  g.fillStyle = '#1d1b2e'; g.strokeStyle = '#1d1b2e'; g.lineCap = 'round';
  if (kind === 'open' || kind === 'oh') {
    const dy = kind === 'oh' ? -4 : 0;
    pill(70, 80 + dy, 34, 58); pill(152, 80 + dy, 34, 58);
    g.fillStyle = '#fff'; ell(80, 96 + dy, 7, 8); ell(162, 96 + dy, 7, 8); g.fillStyle = '#1d1b2e';
  } else if (kind === 'blink') {
    g.lineWidth = 11; g.beginPath(); g.moveTo(68, 114); g.lineTo(106, 114); g.moveTo(150, 114); g.lineTo(188, 114); g.stroke();
  } else {
    g.lineWidth = 12; g.beginPath(); g.arc(87, 122, 20, PI * 1.1, PI * 1.9); g.stroke(); g.beginPath(); g.arc(169, 122, 20, PI * 1.1, PI * 1.9); g.stroke();
  }
  g.lineWidth = 10; const by = kind === 'oh' ? -12 : 0;
  g.beginPath(); g.moveTo(66, 60 + by); g.lineTo(104, 53 + by); g.moveTo(152, 53 + by); g.lineTo(190, 60 + by); g.stroke();
  g.fillStyle = '#5b1f2a';

}
function buildPip() {

  const root = new THREE.Group(), rig = new THREE.Group(); root.add(rig);
  const leg = side => { const p = new THREE.Group(); p.position.set(0.23 * side, 0.82, 0);
    put(p, box(0.42, 0.6, 0.42, C.pants, 0.07), 0, -0.3, 0); put(p, box(0.44, 0.24, 0.54, C.shoe, 0.08), 0, -0.7, 0.05);
    put(p, box(0.46, 0.06, 0.56, '#f4f4f4', 0.02), 0, -0.79, 0.05); rig.add(p); return p; };

  put(upper, box(0.6, 0.22, 0.06, C.trim, 0.03), 0, 0.22, 0.26);
  put(upper, box(0.72, 0.32, 0.18, C.trim, 0.07), 0, 0.72, -0.3);
  put(upper, box(0.62, 0.5, 0.06, C.trim, 0.04), 0, 0.42, -0.26); // back panel, since we mostly see Pip from behind
  const arm = side => { const p = new THREE.Group(); p.position.set(0.67 * side, 0.8, 0);
    put(p, box(0.38, 0.6, 0.38, C.hoodie, 0.08), 0, -0.25, 0); put(p, box(0.4, 0.09, 0.4, C.trim, 0.03), 0, -0.56, 0);
    put(p, box(0.32, 0.22, 0.32, C.skin, 0.08), 0, -0.7, 0); upper.add(p); return p; };
  const armL = arm(1), armR = arm(-1);
  const head = new THREE.Group(); head.position.y = 1.22; upper.add(head);
  put(head, box(0.68, 0.66, 0.66, C.skin, 0.13), 0, 0, 0);
  const faces = { open: faceTex('open'), blink: faceTex('blink'), oh: faceTex('oh'), happy: faceTex('happy') };
  const faceMat = new THREE.MeshLambertMaterial({ map: faces.open, transparent: true });
  put(head, new THREE.Mesh(new THREE.PlaneGeometry(0.58, 0.58), faceMat), 0, -0.02, 0.334);
  put(head, box(0.72, 0.2, 0.7, C.cap, 0.08), 0, 0.36, 0);
  put(head, box(0.58, 0.06, 0.34, C.brim, 0.03), 0, 0.28, 0.45);
  put(head, box(0.1, 0.05, 0.1, C.brim, 0.02), 0, 0.48, 0);

/* merge each chunk's static meshes into one mesh per material, so the frame is a few dozen draw calls instead of ~1000 */
function mergeChunks() {
  for (const [, g] of chunks) {
    g.updateMatrixWorld(true);
    const buckets = new Map(), victims = [];
    g.children.forEach(o => {
      if (o.userData.dyn || !o.isMesh) return;
      const key = o.material.uuid + '|' + (o.castShadow ? 1 : 0);
      if (!buckets.has(key)) buckets.set(key, { mat: o.material, cast: o.castShadow, list: [] });
      buckets.get(key).list.push(o); victims.push(o);
    });
    victims.forEach(o => g.remove(o));
    for (const b of buckets.values()) {
      let total = 0; const parts = [];
      for (const o of b.list) {
        let geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
        o.updateMatrix(); geo.applyMatrix4(o.matrix);
        parts.push(geo); total += geo.attributes.position.count;
      }
      const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3); let off = 0;
      for (const geo of parts) {
        pos.set(geo.attributes.position.array, off * 3);
        if (geo.attributes.normal) nor.set(geo.attributes.normal.array, off * 3);

      }

      mg.setAttribute('position', new THREE.BufferAttribute(pos, 3)); mg.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      mg.computeBoundingSphere();
      const m = new THREE.Mesh(mg, b.mat); m.castShadow = b.cast; m.receiveShadow = true; g.add(m);
    }
  }
}

function applyPose(st, t) {

/* ------------------------------------------------------------------ particles */
const PMAX = 240, AMAX = 140;
const dummy = new THREE.Object3D(), ZERO = new THREE.Matrix4().makeScale(0, 0, 0);
let CONF, SPARK, GOLD, PADC, SPAWNC, DUST, lastCount = PMAX;
function makeParticles() {
  parts = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshBasicMaterial({ color: 0xffffff }), PMAX);
  parts.instanceMatrix.setUsage(THREE.DynamicDrawUsage); parts.frustumCulled = false;
  const white = new THREE.Color(0xffffff);
  for (let i = 0; i < PMAX; i++) { parts.setMatrixAt(i, ZERO); parts.setColorAt(i, white); }
  scene.add(parts);
  CONF = ['#ff5d5d', '#ffcc33', '#4cd964', '#5ac8fa', '#a78bfa', '#ff8ad8'].map(c => new THREE.Color(c));
  SPARK = ['#ffffff', '#ffe066', '#9fd6ff'].map(c => new THREE.Color(c));
  GOLD = ['#ffe066', '#ffcc33', '#ffffff'].map(c => new THREE.Color(c));
  PADC = [TH.pad, '#ffffff'].map(c => new THREE.Color(c));
  SPAWNC = ['#ffffff', TH.spawn[1], '#ffe066'].map(c => new THREE.Color(c));
  DUST = new THREE.Color(TH.cracks ? '#8a7f8f' : (TH.prop === 'lollipop' ? '#fff0f6' : '#f1ead9'));

    const m = TH.ambient === 'embers' ? new THREE.MeshBasicMaterial({ color: 0xffa040 }) : new THREE.MeshBasicMaterial({ color: 0xffffff });

}
function drawParticles(t) {
  let idx = 0;

    const P = B[b], tau = t - P.t;
    if (tau < 0 || tau > P.life) continue;
    for (let i = 0; i < P.n && idx < PMAX; i++) {
      const r1 = hash(b * 97 + i * 1.7), r2 = hash(b * 31 + i * 5.3 + 1), r3 = hash(b * 13 + i * 9.1 + 2), r4 = hash(b * 7 + i * 3.3 + 3);
      let col; const z0 = -P.s;

        const vx = (r1 - 0.5) * 6, vz = (r2 - 0.5) * 6, vy = 4 + r3 * 5, k = 1.6, g = 9, e = (1 - Math.exp(-k * tau)) / k;

        dummy.rotation.set(tau * (3 + r1 * 5), tau * (2 + r2 * 4), r3 * 6);

        col = CONF[i % CONF.length];

        dummy.rotation.set(tau * 6, tau * 6, 0); dummy.scale.set(s, s, s);
        const pal = P.col === 'gold' ? GOLD : P.col === 'pad' ? PADC : P.col === 'spawn' ? SPAWNC : SPARK; col = pal[i % pal.length];
      } else {
        const a = i / P.n * PI * 2 + r1, sp = 1.2 + r2 * 0.8, s = 0.17 * (1 - tau / P.life) * (0.7 + r4 * 0.6);
        dummy.position.set(P.x + Math.cos(a) * sp * tau, P.y + 0.08 + (0.9 + r3 * 0.6) * tau, z0 + Math.sin(a) * sp * tau * 0.8);
        dummy.rotation.set(r1 * 3, r2 * 3, 0); dummy.scale.set(s, s, s); col = DUST;

  lastCount = idx; parts.instanceMatrix.needsUpdate = true; if (parts.instanceColor) parts.instanceColor.needsUpdate = true;

    for (let i = 0; i < AMAX; i++) {

}

/* ------------------------------------------------------------------ init + frame */
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let camX = 0, camY = 0, camS = 0, camYaw = PI, snapNext = true, lastSegType = '';
// Framed for the Reddit-story layout: post card covers the top ~26% and captions start at 66%,
// so Pip is kept in the band between them (roughly 35%-57% of the frame height).
const CAM = { back: 9.0, up: 5.2, ahead: 4.0, lookY: -1.0, fov: 60 };

function skyTexture(w, h) {
  const c = document.createElement('canvas'); c.width = 288; c.height = 512; const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 512);
  grd.addColorStop(0, TH.sky[0]); grd.addColorStop(0.5, TH.sky[1]); grd.addColorStop(1, TH.sky[2]);
  g.fillStyle = grd; g.fillRect(0, 0, 288, 512);
  const sx = TH.sun.x * 288, sy = TH.sun.y * 512;
  const glow = g.createRadialGradient(sx, sy, 4, sx, sy, 120);
  glow.addColorStop(0, `rgba(${TH.sun.glow},0.9)`); glow.addColorStop(0.25, `rgba(${TH.sun.glow},0.4)`); glow.addColorStop(1, `rgba(${TH.sun.glow},0)`);

}

function setup(opts) {
  TH = THEMES[opts.theme] || THEMES.sky;
  LAMBERT = opts.lambert !== false;
  const W = opts.width || 1080, H = opts.height || 1920;
  renderer = new THREE.WebGLRenderer({ canvas, antialias: opts.antialias !== false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1); renderer.setSize(W, H, false);

  scene.add(new THREE.HemisphereLight(new THREE.Color(TH.hemi[0]), new THREE.Color(TH.hemi[1]), TH.hemi[2]));
  scene.add(new THREE.AmbientLight(0xffffff, TH.amb));

  sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);

  makeParticles();

  return { duration: course.end, moves: course.moves.length };
}

function frame(t, dt) {
  const st = stateAt(t);
  if (st.seg.type === 'spawn' && lastSegType !== 'spawn') snapNext = true;
  lastSegType = st.seg.type;
  // character
  const r = pip.root; r.visible = st.vis;
  r.position.set(st.x, st.y, -st.s);
  camYaw = snapNext ? st.yaw : camYaw + angDiff(camYaw, st.yaw) * (1 - Math.exp(-dt * 14));
  r.rotation.set(0, camYaw, 0);

  for (const sp of course.spinners) sp.bar.rotation.y = (sp.phase || 0) + sp.w * t;
  for (const c of course.coins) {

window.Course = {
  setup,
  // render n frames starting at time t0 and return them as JPEG data URLs
  frames(t0, n, fps, quality = 0.92) {
    const out = [], dt = 1 / fps;
    for (let i = 0; i < n; i++) { frame(t0 + i * dt, dt); out.push(canvas.toDataURL('image/jpeg', quality)); }
    return out;

  timing(t0, n, fps) { // render vs readback vs encode timing, for tuning

      const a = performance.now(); frame(t0 + i * dt, dt);
      const b = performance.now(); gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, buf);

  render(t, dt) { frame(t, dt || 1 / 30); },
  stats() { renderer.info.autoReset = true; frame(10, 1 / 30); const i = renderer.info; let n = 0; scene.traverse(o => { if (o.isMesh && o.visible) n++; }); return { calls: i.render.calls, tris: i.render.triangles, meshes: n }; },

};

if (qs.get('render') !== '1') {
  const info = setup({ theme: qs.get('theme') || 'sky', seed: parseInt(qs.get('seed') || '7', 10), width: 540, height: 960, duration: 150 });

})();
